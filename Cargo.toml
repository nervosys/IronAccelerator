[workspace]
resolver = "2"
members = [
    "crates/ironaccelerator",
    "crates/ironaccelerator-core",
    "crates/ironaccelerator-cuda",
    "crates/ironaccelerator-cuda-sys",
    "crates/ironaccelerator-rocm",
    "crates/ironaccelerator-rocm-sys",
    "crates/ironaccelerator-metal",
    "crates/ironaccelerator-qnn",
    "crates/ironaccelerator-qnn-sys",
    "crates/ironaccelerator-vulkan",
    "crates/ironaccelerator-opengl",
    "crates/ironaccelerator-dx12",
    "crates/ironaccelerator-webgpu",
    "crates/ironaccelerator-tpu",
    "crates/ironaccelerator-levelzero",
    "crates/ironaccelerator-neuron",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
authors = ["NERVOSYS"]
repository = "https://github.com/nervosys/IronAccelerator"
homepage = "https://github.com/nervosys/IronAccelerator"
description = "Low-level, hardware-agnostic Rust interface over CUDA, ROCm, Metal, and other accelerators. Includes a faster drop-in replacement for cudarc."
keywords = ["cuda", "rocm", "gpu", "cudarc", "accelerator"]
categories = ["api-bindings", "hardware-support", "science"]

[workspace.dependencies]
ironaccelerator-core      = { path = "crates/ironaccelerator-core",     version = "2.1.0" }
ironaccelerator-cuda      = { path = "crates/ironaccelerator-cuda",     version = "2.1.0" }
ironaccelerator-cuda-sys  = { path = "crates/ironaccelerator-cuda-sys", version = "2.1.0" }
ironaccelerator-rocm      = { path = "crates/ironaccelerator-rocm",     version = "2.1.0" }
ironaccelerator-rocm-sys  = { path = "crates/ironaccelerator-rocm-sys", version = "2.1.0" }
ironaccelerator-metal     = { path = "crates/ironaccelerator-metal",    version = "2.1.0" }
ironaccelerator-qnn       = { path = "crates/ironaccelerator-qnn",      version = "2.1.0" }
ironaccelerator-qnn-sys   = { path = "crates/ironaccelerator-qnn-sys",  version = "2.1.0" }
ironaccelerator-vulkan    = { path = "crates/ironaccelerator-vulkan",   version = "2.1.0" }
ironaccelerator-opengl    = { path = "crates/ironaccelerator-opengl",   version = "2.1.0" }
ironaccelerator-dx12      = { path = "crates/ironaccelerator-dx12",     version = "2.1.0" }
ironaccelerator-webgpu    = { path = "crates/ironaccelerator-webgpu",   version = "2.1.0" }
ironaccelerator-tpu       = { path = "crates/ironaccelerator-tpu",      version = "2.1.0" }
ironaccelerator-levelzero = { path = "crates/ironaccelerator-levelzero", version = "2.1.0" }
ironaccelerator-neuron    = { path = "crates/ironaccelerator-neuron",   version = "2.1.0" }

half      = { version = "2", default-features = false, features = ["num-traits"] }
bitflags  = "2"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
libloading = "0.9"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
inherits = "release"
