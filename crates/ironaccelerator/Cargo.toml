[package]
name = "ironaccelerator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance, agentic-first acceleration library spanning CUDA, ROCm, Metal, and Qualcomm NPUs"
readme = "../../README.md"

[dependencies]
ironaccelerator-core     = { workspace = true }
ironaccelerator-ontology = { workspace = true, optional = true }
ironaccelerator-cuda     = { workspace = true, optional = true }
ironaccelerator-rocm     = { workspace = true, optional = true }
ironaccelerator-metal    = { workspace = true, optional = true }
ironaccelerator-qnn      = { workspace = true, optional = true }
parking_lot = { workspace = true }
once_cell   = { workspace = true }

[features]
default  = ["cuda", "rocm", "metal", "qnn", "ontology"]
ontology = ["dep:ironaccelerator-ontology"]
cuda     = ["dep:ironaccelerator-cuda"]
rocm     = ["dep:ironaccelerator-rocm"]
metal    = ["dep:ironaccelerator-metal"]
qnn      = ["dep:ironaccelerator-qnn"]
all      = ["cuda", "rocm", "metal", "qnn", "ontology"]

[[example]]
name = "agent_plan"
required-features = ["ontology"]
