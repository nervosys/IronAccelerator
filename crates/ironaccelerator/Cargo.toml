[package]
name = "ironaccelerator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Facade crate for IronAccelerator — re-exports the per-backend driver wrappers and a cross-backend Runtime/planner."
keywords = ["cuda", "rocm", "gpu", "accelerator", "cudarc"]
categories = ["api-bindings", "hardware-support"]
documentation = "https://docs.rs/ironaccelerator"
readme = "../../README.md"

[dependencies]
ironaccelerator-core     = { workspace = true }
ironaccelerator-ontology = { workspace = true, optional = true }
ironaccelerator-cuda     = { workspace = true, optional = true }
ironaccelerator-rocm     = { workspace = true, optional = true }
ironaccelerator-metal    = { workspace = true, optional = true }
ironaccelerator-qnn      = { workspace = true, optional = true }
ironaccelerator-vulkan    = { workspace = true, optional = true }
ironaccelerator-opengl    = { workspace = true, optional = true }
ironaccelerator-webgpu    = { workspace = true, optional = true }
ironaccelerator-tpu       = { workspace = true, optional = true }
ironaccelerator-levelzero = { workspace = true, optional = true }
ironaccelerator-neuron    = { workspace = true, optional = true }
parking_lot = { workspace = true }
once_cell   = { workspace = true }

[features]
default   = ["cuda", "rocm", "metal", "qnn", "ontology"]
ontology  = ["dep:ironaccelerator-ontology"]
cuda      = ["dep:ironaccelerator-cuda"]
rocm      = ["dep:ironaccelerator-rocm"]
metal     = ["dep:ironaccelerator-metal"]
qnn       = ["dep:ironaccelerator-qnn"]
vulkan    = ["dep:ironaccelerator-vulkan"]
opengl    = ["dep:ironaccelerator-opengl"]
webgpu    = ["dep:ironaccelerator-webgpu"]
tpu       = ["dep:ironaccelerator-tpu"]
levelzero = ["dep:ironaccelerator-levelzero"]
neuron    = ["dep:ironaccelerator-neuron"]
all       = ["cuda", "rocm", "metal", "qnn", "vulkan", "opengl", "webgpu",
             "tpu", "levelzero", "neuron", "ontology"]

[[example]]
name = "agent_plan"
required-features = ["ontology"]
