[package]
name = "ironaccelerator-metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Metal backend for IronAccelerator (Apple GPU + ANE via MPS, MPSGraph, MLX-style kernels)"

[dependencies]
ironaccelerator-core = { workspace = true }
once_cell  = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
metal            = "0.32"
objc2            = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
block2           = "0.6"

[features]
default = []
mps     = []
mpsgraph = []
mlx     = []
coreml  = []
