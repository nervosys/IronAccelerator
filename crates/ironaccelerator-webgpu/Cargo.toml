[package]
name = "ironaccelerator-webgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebGPU backend for IronAccelerator — browser/WASM adapter binding; the host page owns the GPUDevice. Dependency-free."
keywords = ["webgpu", "wasm", "gpu", "browser", "compute"]
categories = ["api-bindings", "hardware-support", "wasm"]
documentation = "https://docs.rs/ironaccelerator-webgpu"

[dependencies]
ironaccelerator-core = { workspace = true }

[features]
default = []

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
