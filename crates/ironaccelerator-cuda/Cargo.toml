[package]
name = "ironaccelerator-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe CUDA driver wrappers + a faster, drop-in replacement for cudarc. Targets CUDA Toolkit 13.2 via libloading."
keywords = ["cuda", "gpu", "cudarc", "nvidia", "driver"]
categories = ["api-bindings", "hardware-support", "science"]
documentation = "https://docs.rs/ironaccelerator-cuda"
readme = "../../README.md"

[dependencies]
ironaccelerator-core     = { workspace = true }
ironaccelerator-cuda-sys = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
# Per-instance per-thread storage — backs MemPool's lock-free front cache.
thread_local = "1"
half = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
cudarc    = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "cuda-13020", "fallback-dynamic-loading"] }

[[bench]]
name = "host_hot_path"
harness = false

[[bench]]
name = "gpu_vs_cudart"
harness = false

[[bench]]
name = "vs_cudarc"
harness = false

[features]
default = ["driver", "runtime", "cublas", "cublaslt", "cudnn", "nvrtc",
           "curand", "nccl", "cusparse", "cusolver", "cufft", "cutensor",
           "nvtx", "cupti", "f16"]

driver   = []
runtime  = []
cublas   = []
cublaslt = []
cudnn    = []
nvrtc    = []
curand   = []
nccl     = []
cusparse = []
cusolver = []
cufft    = []
cutensor = []
nvtx     = []
cupti    = []
f16      = ["dep:half"]
