[package]
name = "ironaccelerator-rocm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe ROCm/HIP driver wrappers for AMD CDNA & RDNA GPUs. Same fast-path posture as the CUDA crate (atomic-free wrapped ops via cached fn-pointer tables)."
keywords = ["rocm", "hip", "amd", "gpu", "driver"]
categories = ["api-bindings", "hardware-support", "science"]
documentation = "https://docs.rs/ironaccelerator-rocm"
readme = "../../README.md"

[dependencies]
ironaccelerator-core     = { workspace = true }
ironaccelerator-rocm-sys = { workspace = true }
libloading = { workspace = true }
once_cell  = { workspace = true }
parking_lot = { workspace = true }

[features]
default = ["dynamic-loading"]
dynamic-loading = []
hip      = []
hipblas  = []
hipblaslt = []
miopen   = []
rocfft   = []
rocrand  = []
rocsparse = []
rocsolver = []
rccl     = []
