[package]
name = "ironaccelerator-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Vulkan Compute backend for IronAccelerator — cross-vendor GPU compute (native + WASM via WebGPU-over-Vulkan)"

[dependencies]
ironaccelerator-core = { workspace = true }
once_cell = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
naga = { workspace = true }

[features]
default = []
