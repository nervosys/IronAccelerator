[package]
name = "ironaccelerator-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vulkan compute backend for IronAccelerator — cross-vendor GPU compute."
keywords = ["vulkan", "compute", "gpu", "cross-vendor", "spirv"]
categories = ["api-bindings", "hardware-support", "graphics"]
documentation = "https://docs.rs/ironaccelerator-vulkan"

[dependencies]
ironaccelerator-core = { workspace = true }
once_cell = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
naga = { workspace = true }

[features]
default = []
