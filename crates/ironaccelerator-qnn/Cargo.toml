[package]
name = "ironaccelerator-qnn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Qualcomm Hexagon NPU driver wrappers (QNN SDK) for IronAccelerator."
keywords = ["qnn", "qualcomm", "npu", "hexagon", "snapdragon"]
categories = ["api-bindings", "hardware-support"]
documentation = "https://docs.rs/ironaccelerator-qnn"

[dependencies]
ironaccelerator-core     = { workspace = true }
ironaccelerator-qnn-sys  = { workspace = true }
libloading = { workspace = true }
once_cell  = { workspace = true }
parking_lot = { workspace = true }

[features]
default = ["dynamic-loading"]
dynamic-loading = []
htp = []   # Hexagon Tensor Processor
gpu = []   # Adreno GPU backend of QNN
cpu = []   # QNN CPU reference
