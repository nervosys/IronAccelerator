name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --no-deps
      - run: cargo build --workspace
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --tests

  # Build the full backend matrix — same set of crates CI compiles that
  # we ship behind the `all` feature. No vendor SDK is linked; every
  # backend loads via libloading at run time.
  feature-matrix:
    name: build / ${{ matrix.os }} / features=${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "cuda,rocm,vulkan,opengl,webgpu,levelzero,tpu,neuron,fpga"
          - os: windows-latest
            features: "cuda,vulkan,opengl,dx12,webgpu,levelzero"
          - os: macos-latest
            features: "metal,webgpu,opengl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ironaccelerator --no-default-features --features "${{ matrix.features }}"

  # `ironaccelerator-core` declares `#![cfg_attr(not(feature = "std"), no_std)]`.
  # Nothing else in CI builds that configuration, so without this job the
  # no_std path rots silently — it had in fact been broken for several
  # releases before 2.0.0. Each feature combination is built separately
  # because feature unification inside a workspace build would mask a
  # missing `alloc` import.
  no-std:
    name: no_std / core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ironaccelerator-core --no-default-features
      - run: cargo build -p ironaccelerator-core --no-default-features --features serde
      - run: cargo build -p ironaccelerator-core

  # The WebGPU backend exists for the browser, so wasm32 is its real target.
  # It was previously impossible to build there — an ungated call to a
  # native-only `wgpu` method — and no CI job would have caught it.
  wasm:
    name: wasm32 / webgpu + core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Belt-and-suspenders: the toolchain action's `targets:` input has been
      # seen to leave the target's `rust-std` absent on cached runners, which
      # surfaces as `E0463: can't find crate for std`. Adding it explicitly is
      # idempotent and guarantees the sysroot is present.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p ironaccelerator-webgpu --target wasm32-unknown-unknown
      - run: cargo build -p ironaccelerator-core --target wasm32-unknown-unknown
      - run: cargo build -p ironaccelerator-core --target wasm32-unknown-unknown --no-default-features
      # Compile the binding tests for wasm32 too. Executing them needs a
      # headless browser (`wasm-pack test --headless --chrome`); compiling is
      # what keeps the `wasm-bindgen-test` harness from bit-rotting.
      - run: cargo test -p ironaccelerator-webgpu --target wasm32-unknown-unknown --no-run

  # The GPU-bound integration tests (`Device::open`, benches) require a live
  # CUDA / ROCm runtime and are gated behind an env flag. CI only runs the
  # pure library + loader-probe tests.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # Supply-chain audit. Closes SI.L2-3.14.3 / RA.L2-3.11.2 by running
  # the RustSec advisory scanner on every push and PR. The job tolerates
  # informational `unmaintained` findings (warnings → exit 0) but fails
  # on any vulnerability advisory.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Install cargo-audit from its own pinned lockfile. Building it unlocked
      # (as rustsec/audit-check@v2 does internally) lets a transitive dep resolve
      # to a version whose MSRV outruns the runner's toolchain — `kstring 2.0.4`
      # wanted rustc 1.96 on a 1.89 runner. `--locked` uses the versions
      # cargo-audit tested against, which build on stable.
      - run: cargo install --locked cargo-audit
      # Plain `cargo audit` fails on vulnerability advisories but treats
      # informational `unmaintained` / `yanked` findings as warnings (exit 0),
      # which is the posture this job has always had.
      - run: cargo audit
