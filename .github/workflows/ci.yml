name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --no-deps
      - run: cargo build --workspace
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --tests

  # Build the full backend matrix — same set of crates CI compiles that
  # we ship behind the `all` feature. No vendor SDK is linked; every
  # backend loads via libloading at run time.
  feature-matrix:
    name: build / ${{ matrix.os }} / features=${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "cuda,rocm,vulkan,opengl,webgpu,levelzero,tpu,neuron"
          - os: windows-latest
            features: "cuda,vulkan,opengl,dx12,webgpu,levelzero"
          - os: macos-latest
            features: "metal,webgpu,opengl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ironaccelerator --no-default-features --features "${{ matrix.features }}"

  # `ironaccelerator-core` declares `#![cfg_attr(not(feature = "std"), no_std)]`.
  # Nothing else in CI builds that configuration, so without this job the
  # no_std path rots silently — it had in fact been broken for several
  # releases before 2.0.0. Each feature combination is built separately
  # because feature unification inside a workspace build would mask a
  # missing `alloc` import.
  no-std:
    name: no_std / core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ironaccelerator-core --no-default-features
      - run: cargo build -p ironaccelerator-core --no-default-features --features serde
      - run: cargo build -p ironaccelerator-core

  # The WebGPU backend exists for the browser, so wasm32 is its real target.
  # It was previously impossible to build there — an ungated call to a
  # native-only `wgpu` method — and no CI job would have caught it.
  wasm:
    name: wasm32 / webgpu + core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ironaccelerator-webgpu --target wasm32-unknown-unknown
      - run: cargo build -p ironaccelerator-core --target wasm32-unknown-unknown
      - run: cargo build -p ironaccelerator-core --target wasm32-unknown-unknown --no-default-features

  # The GPU-bound integration tests (`Device::open`, benches) require a live
  # CUDA / ROCm runtime and are gated behind an env flag. CI only runs the
  # pure library + loader-probe tests.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # Supply-chain audit. Closes SI.L2-3.14.3 / RA.L2-3.11.2 by running
  # the RustSec advisory scanner on every push and PR. The job tolerates
  # informational `unmaintained` findings (warnings → exit 0) but fails
  # on any vulnerability advisory.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
