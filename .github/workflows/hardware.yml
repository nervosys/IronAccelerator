name: hardware

# Live-accelerator validation for hardware that GitHub-HOSTED runners do not
# provide (NVIDIA GPU, AMD GPU, Intel GPU, FPGA, Gaudi). These jobs run on
# SELF-HOSTED runners you register against this repo with matching labels — see
# docs/backends/CI-HARDWARE.md.
#
# Trigger is workflow_dispatch ONLY (manual), deliberately: a job targeting a
# self-hosted label that no runner satisfies would otherwise sit queued. Run it
# by hand once the matching runner is online (Actions tab → "hardware" → Run
# workflow), or wire a schedule once a runner is permanently attached.
#
# Each job sets IRON_RUN_GPU_TESTS=1, the opt-in the backend smoke tests gate
# on; without it (and without a device) those tests skip cleanly, which is why
# the normal CI on hosted runners stays green.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Which hardware lane to run"
        type: choice
        default: cuda
        options: [cuda, rocm, levelzero, fpga]

env:
  CARGO_TERM_COLOR: always
  IRON_RUN_GPU_TESTS: "1"

jobs:
  cuda:
    name: cuda / live (NVIDIA GPU, self-hosted)
    if: ${{ github.event.inputs.backend == 'cuda' }}
    # Register an NVIDIA host with, e.g.:
    #   ./config.sh --url https://github.com/nervosys/IronAccelerator \
    #               --labels self-hosted,linux,cuda
    # The CUDA driver (libcuda) and NVRTC must be installed; the full Toolkit is
    # only needed for the vendor-library handles (cuBLASLt/cuDNN/…).
    #
    # CUDA is the largest and most `unsafe`-dense backend in the workspace, and
    # it was the last one with no live lane — its driver paths were exercised
    # only on developer machines, which CI cannot see. That is what this closes.
    runs-on: [self-hosted, linux, cuda]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # Fail loudly if this runner has no GPU. The CUDA tests gate on device
      # presence and skip *cleanly* when there is none (green, having asserted
      # nothing) — the exact false-pass this lane exists to prevent. Every step
      # below is only meaningful once this one has proved a device is visible.
      - name: Require a visible CUDA device
        run: |
          nvidia-smi -L
          test "$(nvidia-smi -L | grep -c '^GPU')" -ge 1

      # End-to-end driver path: enumerate/bind, stream + event lifecycle,
      # H2D/D2H/D2D memcpy, NVRTC compile → launch (SAXPY), and safe-wrapper vs
      # raw `iron_cuda_sys` parity.
      - run: cargo test -p ironaccelerator-cuda --test gpu_smoke -- --nocapture

      # The `#[ignore]`-gated cudarc round-trips. These never run anywhere else
      # — not in hosted CI, not in a plain `cargo test` on a GPU box — so this
      # is the only place the advertised drop-in semantics are actually
      # executed rather than merely type-checked.
      - run: cargo test -p ironaccelerator-cuda --test cudarc_compat -- --ignored --nocapture

      # Remaining device-touching suites: staged/pinned memcpy, the MemPool
      # recycling allocator, and the driver extras (peer access, graphs, RNG).
      - run: cargo test -p ironaccelerator-cuda --test memcpy_staged -- --nocapture
      - run: cargo test -p ironaccelerator-cuda --test pool_smoke -- --nocapture
      - run: cargo test -p ironaccelerator-cuda --test driver_extras -- --nocapture

      # Pure-host unit tests (cache-key hashing, launch geometry, pool buckets).
      - run: cargo test -p ironaccelerator-cuda --lib -- --nocapture
      - run: cargo test -p ironaccelerator-cuda-sys --lib -- --nocapture

      # The umbrella survey, with CUDA actually present in the registry.
      - run: cargo test -p ironaccelerator --no-default-features --features cuda --test runtime_smoke -- --nocapture

  rocm:
    name: rocm / live (AMD GPU, self-hosted)
    if: ${{ github.event.inputs.backend == 'rocm' }}
    # Register an AMD-GPU host with, e.g.:
    #   ./config.sh --url https://github.com/nervosys/IronAccelerator \
    #               --labels self-hosted,linux,rocm
    # ROCm 6.2+ and its libraries (libamdhip64, libhiprtc) must be installed.
    runs-on: [self-hosted, linux, rocm]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # End-to-end: HIPRTC compile → module load → launch → MemPool round-trip.
      - run: cargo test -p ironaccelerator-rocm --test rocm_smoke -- --nocapture
      # The pure-host unit tests (cache-key hashing, pool bucket math) too.
      - run: cargo test -p ironaccelerator-rocm --lib -- --nocapture

  levelzero:
    name: level-zero / live (Intel GPU, self-hosted)
    if: ${{ github.event.inputs.backend == 'levelzero' }}
    # Register an Intel Arc/Flex/PVC host with:
    #   ./config.sh --labels self-hosted,linux,intel-gpu
    # `ze_loader` from the Intel compute runtime must be installed. The dispatch
    # test consumes a Kernel-model SPIR-V binary via IA_LEVELZERO_SHADER (build
    # one with Intel's `ocloc`); without it the test skips cleanly.
    runs-on: [self-hosted, linux, intel-gpu]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ironaccelerator-levelzero --test dispatch -- --nocapture
      - run: cargo test -p ironaccelerator-levelzero --lib -- --nocapture

  fpga:
    name: fpga / live (XRT, self-hosted)
    if: ${{ github.event.inputs.backend == 'fpga' }}
    # Register an XRT host (Alveo / Versal card + XRT 2.x) with:
    #   ./config.sh --labels self-hosted,linux,fpga
    # FPGA support is probe/enumerate only (kernels are AOT bitstreams), so this
    # lane validates that `xclProbe` finds the card and the backend enumerates
    # it — there is no compute round-trip to run at the driver line.
    runs-on: [self-hosted, linux, fpga]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ironaccelerator-fpga -- --nocapture
      - run: cargo test -p ironaccelerator --no-default-features --features fpga --test runtime_smoke -- --nocapture
